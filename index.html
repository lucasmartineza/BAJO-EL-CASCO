<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bajo el Casco">
<title>Bajo el Casco · Rally Argentino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/bc-900i.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:BC;src:url(fonts/bc-500.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-600.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-700.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-800.woff2) format("woff2");font-weight:800;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-700i.woff2) format("woff2");font-weight:700;font-style:italic;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-800i.woff2) format("woff2");font-weight:800;font-style:italic;font-display:block}
@font-face{font-family:BC;src:url(fonts/bc-900i.woff2) format("woff2");font-weight:900;font-style:italic;font-display:block}
:root{--navy:#0b1f33;--navy2:#13304d;--cel:#74acdf;--ink:#ffffff;--soft:#d6e6f4;--mute:#9db4c9;--line:rgba(214,230,244,.16);--rec:#ff4d4f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* botones inclinados estilo transmisión */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 20px;font-family:BC,sans-serif;font-style:italic;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;transform:skewX(-12deg);z-index:-1}
.btn.cel{color:var(--navy)}.btn.cel::before{background:var(--cel)}
.btn.white{color:var(--navy)}.btn.white::before{background:#fff}
.btn.ghost{color:#fff}.btn.ghost::before{border:2px solid rgba(255,255,255,.8);background:rgba(11,31,51,.45)}
.btn:active{transform:scale(.98)}
.link{font-family:BC,sans-serif;font-style:italic;font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--cel);min-height:44px;display:flex;align-items:center;gap:8px}
.link.m{color:var(--mute)}
h1{font-family:BC,sans-serif;font-style:italic;font-weight:900;font-size:36px;line-height:1;text-transform:uppercase}
.tab{display:inline-block;position:relative;padding:5px 12px;font-family:BC,sans-serif;font-style:italic;font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);isolation:isolate}
.tab::before{content:"";position:absolute;inset:0;background:var(--cel);transform:skewX(-12deg);z-index:-1}

/* bienvenida */
#welcome{background:var(--navy)}
#welcome .topo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;pointer-events:none}
#welcome .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 40% at 50% 44%,rgba(116,172,223,.22) 0%,rgba(11,31,51,0) 70%),linear-gradient(180deg,rgba(11,31,51,.2) 0%,rgba(11,31,51,.5) 60%,#0b1f33 88%)}
#welcome .wrap{position:relative;flex:1;display:flex;flex-direction:column;padding:calc(var(--st) + 26px) 24px calc(var(--sb) + 10px);max-width:520px;width:100%;margin:0 auto;overflow-y:auto}
#welcome .ra{width:min(60vw,240px);height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
#welcome .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px;position:relative}
#welcome .hero img{width:min(70vw,280px);height:auto}
#welcome .tag{font-family:BC,sans-serif;font-style:italic;font-weight:800;font-size:26px;line-height:1.15;margin:26px 0 18px}
#welcome .bot{display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
#settings{border:1px solid var(--line);padding:4px 16px;background:rgba(9,25,42,.96);margin-top:6px}
#settings label,#settings .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;font-size:14px;color:var(--soft)}
#settings > * + *{border-top:1px solid var(--line)}
#settings select{background:var(--navy2);color:#fff;border:1px solid #2c4a68;padding:8px 10px;font-size:14px}
#settings input[type=checkbox]{width:22px;height:22px;accent-color:var(--cel)}

/* grabación */
#rec{background:#000}
#stage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#rec .rectime{position:absolute;top:calc(var(--st) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(11,31,51,.75);font-family:BC,sans-serif;font-weight:700;font-size:16px;letter-spacing:.1em;z-index:2}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#rec .controls{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(var(--sb) + 12px);display:grid;grid-template-columns:1.25fr 1fr;gap:16px;max-width:520px;margin:0 auto}
#rec .btn{min-height:54px;font-size:17px;padding:0 10px}
#rec .closeBtn{position:absolute;top:calc(var(--st) + 8px);left:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(11,31,51,.6);border-radius:50%;z-index:3}
#readyPill{font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
#recBtn .rdot{width:12px;height:12px;border-radius:50%;background:var(--rec)}
#finishBtn .sq{width:13px;height:13px;background:var(--rec)}

/* guardado y mis videos */
#done,#lib{background:var(--navy)}
#done .wrap,#lib .wrap{flex:1;display:flex;flex-direction:column;gap:14px;padding:calc(var(--st) + 22px) 22px calc(var(--sb) + 14px);max-width:520px;width:100%;margin:0 auto;min-height:0}
#playback{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 8px}
.grid2 .btn{font-size:17px;padding:0 8px;min-height:54px}
.status{font-size:13px;color:var(--mute);text-align:center;min-height:18px;line-height:1.45}
.status.ok{color:#a6e3b4}
#libList{flex:1;overflow-y:auto;list-style:none;border-top:1px solid var(--line)}
#libList li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#libList .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
#libList .qs{font-family:BC,sans-serif;font-style:italic;font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
#libList .acts{display:flex;gap:8px;flex-wrap:wrap}
#libList .acts button{min-height:40px;padding:0 14px;border:1px solid #2c4a68;background:var(--navy2);font-family:BC,sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#libList .acts .del{color:#ff9a9c;border-color:#5a2a35}
.empty{color:var(--mute);font-size:14px;padding:30px 0;text-align:center}

#msg{background:var(--navy);align-items:center;justify-content:center;text-align:center;padding:32px;gap:18px}
#msg p{color:var(--soft);line-height:1.55;max-width:340px;font-size:15px}
#rotate{position:fixed;inset:0;z-index:9;background:var(--navy);display:none;align-items:center;justify-content:center;font-family:BC,sans-serif;font-style:italic;font-weight:800;font-size:24px;letter-spacing:.1em;text-transform:uppercase;padding:24px;text-align:center}
@media (orientation:landscape) and (max-height:520px){#rotate{display:flex}}
</style>
</head>
<body>

<!-- 1. BIENVENIDA: primero la marca; la cámara se enciende recién al tocar Comenzar -->
<section id="welcome" class="screen on" aria-label="Bienvenida">
  <img class="topo" src="topo.svg" alt="">
  <div class="glow"></div>
  <div class="wrap">
    <img class="ra" src="ra.png" alt="Campeonato Rally Argentino">
    <div class="hero"><img src="logo.png" alt="Bajo el Casco"></div>
    <p class="tag">Una pregunta, una cámara y una historia fuera de los cronómetros.</p>
    <div class="bot">
      <button class="btn cel" id="startBtn">Ver mi pregunta ▸</button>
      <div class="row">
        <button class="link m" id="settingsBtn" aria-expanded="false">Ajustes</button>
        <button class="link" id="libBtn">Mis videos <span id="libCount"></span></button>
      </div>
      <div id="settings" hidden>
        <label>Guardar en el teléfono al terminar<input type="checkbox" id="optAuto" checked></label>
        <label>Guardar también versión limpia<input type="checkbox" id="optClean" checked></label>
        <label>Calidad
          <select id="optRes"><option value="720">720 × 1280 (fluida)</option><option value="1080">1080 × 1920 (máxima)</option></select></label>
        <label>Duración máxima
          <select id="optMax"><option value="0">Sin límite</option><option value="180">3 minutos</option><option value="300">5 minutos</option><option value="600">10 minutos</option></select></label>
        <div class="srow"><span id="remaining">25 preguntas disponibles</span><button class="link" id="resetBtn">Reiniciar mazo</button></div>
      </div>
    </div>
  </div>
</section>

<!-- 2. GRABACIÓN (lo que se ve en el canvas es lo que se graba; reloj y botones no) -->
<section id="rec" class="screen" aria-label="Grabando">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <button class="closeBtn" id="cancelBtn" aria-label="Volver al inicio">✕</button>
  <div class="rectime" id="readyPill">Leé la pregunta y tocá Comenzar</div>
  <div class="rectime" id="recPill" hidden aria-hidden="true"><span class="dot"></span><span id="timer">00:00</span></div>
  <div class="controls">
    <button class="btn ghost" id="reaskBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      <span id="reaskLabel">Otra pregunta</span></button>
    <button class="btn cel" id="recBtn"><span class="rdot"></span>Comenzar</button>
    <button class="btn white" id="finishBtn" hidden><span class="sq"></span>Terminar</button>
  </div>
</section>

<!-- 3. GUARDADO -->
<section id="done" class="screen" aria-label="Participación guardada">
  <div class="wrap">
    <div><span class="tab">Participación guardada</span><h1 style="margin-top:12px">Tu historia ya quedó grabada</h1></div>
    <video id="playback" playsinline controls></video>
    <p class="status" id="doneStatus"></p>
    <div class="grid2" id="doneActs">
      <button class="btn cel" id="exportBtn">A la galería</button>
      <button class="btn ghost" id="exportCleanBtn">Versión limpia</button>
    </div>
    <div class="row">
      <button class="link m" id="toLibBtn">Mis videos</button>
      <button class="link" id="againBtn">Nueva participación ▸</button>
    </div>
  </div>
</section>

<!-- 4. MIS VIDEOS -->
<section id="lib" class="screen" aria-label="Mis videos">
  <div class="wrap">
    <div class="row"><h1>Mis videos</h1><button class="link" id="libBack">◂ Volver</button></div>
    <p class="status" id="libStatus">Guardados en este dispositivo.</p>
    <ul id="libList"></ul>
  </div>
</section>

<section id="msg" class="screen" aria-live="polite">
  <img src="logo.png" alt="" style="width:150px">
  <h1 id="msgTitle"></h1>
  <p id="msgText"></p>
  <button class="btn ghost" id="msgBtn" style="min-width:200px">Volver</button>
</section>

<div id="rotate">Girá el celular a vertical</div>
<script src="app.js"></script>
</body>
</html>
